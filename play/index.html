<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10191c" />
    <title>Veilbound · Echoes of the Hollow Crown</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a1316;
        color: #f1e4c2;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      main {
        position: relative;
        width: min(100vw, 177.7778dvh);
        aspect-ratio: 16/9;
        box-shadow: 0 0 70px #0009;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: auto;
        touch-action: none;
        outline: none;
      }
      #hud-settings {
        position: absolute;
        left: 71.3%;
        top: 0;
        width: 6.4%;
        height: 12%;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      #hud-settings:hover {
        background: #e7cb8f12;
      }
      #hud-settings:focus-visible {
        outline: 2px solid #e7cb8f;
        outline-offset: -3px;
      }
      #touch {
        display: none;
        position: fixed;
        inset: auto 1vw 1vh;
        pointer-events: none;
        justify-content: space-between;
        align-items: end;
      }
      #touch section {
        display: grid;
        grid-template-columns: repeat(3, min(11vw, 52px));
        gap: 2px;
      }
      #touch button {
        touch-action: none;
        pointer-events: auto;
        height: min(11vw, 48px);
        color: #fff4cd;
        background: #162328c9;
        border: 1px solid #b49c6c;
        border-radius: 5px;
        font: bold 16px Georgia;
      }
      #touch .gap {
        visibility: hidden;
      }
      @media (pointer: coarse) {
        body.playing #touch {
          display: flex;
        }
      }
      @media (pointer: coarse) and (orientation: portrait) {
        main {
          align-self: start;
          margin-top: 10vh;
        }
        #touch {
          bottom: 9vh;
        }
      }
      #preferences {
        --paper: #f5ecd8;
        --gold: #e4c590;
        --mute: #b7c3b7;
        --rule: #6a79634d;
        width: min(836px, calc(100vw - 36px));
        max-width: none;
        max-height: calc(100dvh - 26px);
        padding: 0;
        margin: auto;
        overflow: auto;
        color: var(--paper);
        color-scheme: dark;
        border: 1px solid #9a8963;
        border-radius: 6px;
        background: #172627;
        box-shadow:
          0 26px 90px #0009,
          inset 0 0 0 4px #263331;
        font:
          15px/1.4 "Avenir Next",
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      #preferences::backdrop {
        background: #091316bb;
        backdrop-filter: blur(5px);
      }
      #preferences [hidden] {
        display: none;
      }
      #preferences button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      #preferences :focus-visible {
        outline: 2px solid #f7d99e;
        outline-offset: 3px;
      }
      .pref-header {
        position: relative;
        padding: 22px 28px 15px;
        border-bottom: 1px solid var(--rule);
      }
      .pref-wordmark,
      .pref-figure figcaption span {
        display: block;
        color: var(--gold);
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.17em;
        font-weight: 650;
      }
      .pref-header h1 {
        font:
          38px/1.12 Georgia,
          serif;
        margin: 4px 0 0;
        letter-spacing: -0.035em;
      }
      .pref-close {
        position: absolute;
        top: 20px;
        right: 22px;
        width: 36px;
        height: 36px;
        background: none;
        border: 1px solid var(--rule);
        border-radius: 50%;
        font-size: 24px !important;
        line-height: 1 !important;
      }
      .pref-layout {
        display: grid;
        grid-template-columns: 0.82fr 1fr;
      }
      .pref-figure {
        margin: 0;
        min-height: 322px;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border-right: 1px solid var(--rule);
        background: #1b3437;
      }
      .pref-figure canvas {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        position: absolute;
        object-fit: cover;
      }
      .pref-figure figcaption {
        position: absolute;
        inset: auto 0 0;
        padding: 34px 22px 19px;
        background: linear-gradient(transparent, #102422de 75%);
        text-shadow: 0 1px 3px #0a1919;
      }
      .pref-figure figcaption strong {
        font:
          23px/1.3 Georgia,
          serif;
        display: block;
        margin-top: 3px;
      }
      .pref-controls {
        padding: 16px 27px 20px;
      }
      .pref-tabs {
        display: flex;
        gap: 22px;
        border-bottom: 1px solid var(--rule);
      }
      .pref-tabs button {
        padding: 8px 0 10px;
        color: var(--mute) !important;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
      }
      .pref-tabs button[aria-selected="true"] {
        color: var(--gold) !important;
        border-color: var(--gold);
      }
      .pref-panel {
        display: grid;
        gap: 20px;
        padding-top: 22px;
      }
      #audio-panel,
      #game-panel {
        gap: 13px;
      }
      .pref-panel fieldset {
        border: none;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      .pref-panel legend {
        padding: 0;
        margin: 0 0 9px;
      }
      .pref-presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: #101e20;
        border: 1px solid #56675f;
        padding: 3px;
        border-radius: 5px;
      }
      .pref-presets label {
        position: relative;
        cursor: pointer;
      }
      .pref-presets input {
        opacity: 0;
        position: absolute;
        inset: 0;
        width: 100%;
        margin: 0;
        cursor: pointer;
      }
      .pref-presets span {
        display: block;
        padding: 7px 2px;
        border-radius: 3px;
        text-align: center;
        color: var(--mute);
        font-size: 14px;
      }
      .pref-presets input:checked + span {
        background: #d9bf8d;
        color: #24302a;
        font-weight: 650;
      }
      .pref-presets input:focus-visible + span {
        outline: 2px solid #fff1c7;
      }
      .pref-detail,
      .pref-toggle small {
        color: var(--mute);
        margin: 6px 0 0;
        font-size: 12px;
        display: block;
      }
      .pref-range {
        display: grid;
        gap: 4px;
      }
      .pref-range span,
      .pref-toggle,
      .pref-action {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .pref-range output {
        color: var(--gold);
        font:
          12px/1.3 ui-monospace,
          monospace;
        font-variant-numeric: tabular-nums;
      }
      .pref-range input {
        width: 100%;
        margin: 0;
        height: 20px;
        appearance: none;
        background: transparent;
        cursor: pointer;
        --fill: 50%;
      }
      .pref-range input::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          var(--gold) var(--fill),
          #405451 var(--fill)
        );
      }
      .pref-range input::-webkit-slider-thumb {
        appearance: none;
        width: 14px;
        height: 14px;
        border: 2px solid #f3dfb3;
        border-radius: 50%;
        background: #c6a774;
        margin-top: -5px;
      }
      .pref-range input::-moz-range-track {
        height: 4px;
        background: #405451;
      }
      .pref-range input::-moz-range-progress {
        height: 4px;
        background: var(--gold);
      }
      .pref-range input::-moz-range-thumb {
        background: var(--gold);
        border-color: #f3dfb3;
      }
      .pref-toggle {
        cursor: pointer;
        min-height: 32px;
      }
      .pref-toggle small {
        margin-top: 1px;
      }
      .pref-toggle input {
        flex: none;
        cursor: pointer;
        appearance: none;
        width: 35px;
        height: 20px;
        margin: 0;
        border: 1px solid #67766d;
        border-radius: 12px;
        background: #2b3b39;
        display: grid;
        align-items: center;
      }
      .pref-toggle input::after {
        content: "";
        width: 12px;
        height: 12px;
        margin-left: 3px;
        background: #b6bdb1;
        border-radius: 50%;
      }
      .pref-toggle input:checked {
        background: #ad9567;
        border-color: #d8bb87;
      }
      .pref-toggle input:checked::after {
        background: #fff1d4;
        transform: translateX(15px);
      }
      .pref-action,
      .pref-footer button {
        background: #253937;
        border: 1px solid #62766b;
        border-radius: 4px;
        padding: 7px 12px;
      }
      .pref-action:hover,
      .pref-close:hover {
        background: #364b43;
      }
      .pref-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 26px;
        border-top: 1px solid var(--rule);
      }
      .pref-footer span {
        color: var(--mute);
        font-size: 12px;
      }
      .pref-footer button {
        min-width: 84px;
        background: #d9bf8d;
        border-color: #ecd4a6;
        color: #24302a !important;
        font-weight: 650 !important;
      }
      @media (max-width: 640px) {
        #preferences {
          width: min(440px, calc(100vw - 16px));
          max-height: calc(100dvh - 12px);
        }
        .pref-header {
          padding: 14px 18px 10px;
        }
        .pref-header h1 {
          font-size: 30px;
        }
        .pref-layout {
          grid-template-columns: 1fr;
        }
        .pref-figure {
          min-height: 0;
          height: clamp(74px, 18dvh, 140px);
          border-right: 0;
        }
        .pref-figure canvas {
          object-position: center 60%;
        }
        .pref-figure figcaption {
          padding: 16px;
        }
        .pref-figure figcaption strong {
          font-size: 19px;
        }
        .pref-controls {
          padding: 7px 18px 16px;
        }
        .pref-panel {
          gap: 14px;
          padding-top: 14px;
        }
        .pref-footer {
          padding: 9px 18px;
        }
      }
      @media (max-height: 540px) and (min-width: 641px) {
        .pref-header {
          padding: 10px 22px;
        }
        .pref-wordmark {
          display: none;
        }
        .pref-header h1 {
          font-size: 28px;
        }
        .pref-close {
          top: 7px;
        }
        .pref-controls {
          padding: 6px 20px 12px;
        }
        .pref-figure {
          min-height: 230px;
        }
        .pref-panel {
          padding-top: 10px;
          gap: 10px;
        }
        #audio-panel,
        #game-panel {
          gap: 6px;
        }
        .pref-footer {
          padding: 6px 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas
        id="game"
        width="384"
        height="216"
        tabindex="0"
        aria-label="Veilbound, a keyboard, gamepad and touch action adventure"
      ></canvas>
      <button
        id="hud-settings"
        type="button"
        title="Settings"
        aria-label="Settings"
        hidden
      ></button>
    </main>
    <div id="touch">
      <section id="pad"></section>
      <section id="buttons"></section>
    </div>
    <dialog id="preferences" aria-labelledby="pref-title">
      <header class="pref-header">
        <span class="pref-wordmark" aria-hidden="true">✧ &nbsp; Veilbound</span>
        <h1 id="pref-title">Settings</h1>
        <button
          type="button"
          class="pref-close"
          data-command="back"
          aria-label="Close settings"
        >
          ×
        </button>
      </header>
      <div class="pref-layout">
        <figure class="pref-figure">
          <canvas
            id="pref-art"
            width="248"
            height="236"
            aria-label="Live view of Rowan at Mossbell Sanctuary"
          ></canvas>
          <figcaption>
            <span>Scene preview</span><strong>Mossbell Sanctuary</strong>
          </figcaption>
        </figure>
        <div class="pref-controls">
          <nav
            class="pref-tabs"
            role="tablist"
            aria-label="Settings categories"
          >
            <button
              type="button"
              id="graphics-tab"
              role="tab"
              aria-controls="graphics-panel"
              data-tab="graphics"
            >
              Graphics
            </button>
            <button
              type="button"
              id="audio-tab"
              role="tab"
              aria-controls="audio-panel"
              data-tab="audio"
            >
              Audio
            </button>
            <button
              type="button"
              id="game-tab"
              role="tab"
              aria-controls="game-panel"
              data-tab="game"
            >
              Gameplay
            </button>
          </nav>
          <section
            class="pref-panel"
            role="tabpanel"
            id="graphics-panel"
            aria-labelledby="graphics-tab"
          >
            <fieldset>
              <legend>Rendering quality</legend>
              <div class="pref-presets">
                <label
                  ><input type="radio" name="quality" value="classic" /><span
                    >Classic</span
                  ></label
                >
                <label
                  ><input type="radio" name="quality" value="balanced" /><span
                    >Balanced</span
                  ></label
                >
                <label
                  ><input type="radio" name="quality" value="high" /><span
                    >High</span
                  ></label
                >
              </div>
              <p class="pref-detail" id="quality-description"></p>
            </fieldset>
            <label class="pref-range"
              ><span>Brightness <output for="pref-brightness"></output></span>
              <input
                id="pref-brightness"
                type="range"
                data-option="brightness"
                min="75"
                max="125"
                step="1"
              />
            </label>
            <label class="pref-toggle"
              ><span
                >Atmospheric effects<small
                  >Drifting particles and weather</small
                ></span
              ><input type="checkbox" data-option="atmosphere"
            /></label>
          </section>
          <section
            class="pref-panel"
            role="tabpanel"
            id="audio-panel"
            aria-labelledby="audio-tab"
            hidden
          >
            <label class="pref-toggle"
              ><span>Enable sound</span
              ><input type="checkbox" data-option="sound"
            /></label>
            <label class="pref-range"
              ><span>Master volume <output for="pref-master"></output></span
              ><input
                id="pref-master"
                type="range"
                data-option="master"
                min="0"
                max="100"
                step="1"
            /></label>
            <label class="pref-range"
              ><span>Music <output for="pref-music"></output></span
              ><input
                id="pref-music"
                type="range"
                data-option="music"
                min="0"
                max="100"
                step="1"
            /></label>
            <label class="pref-range"
              ><span>Sound effects <output for="pref-sfx"></output></span
              ><input
                id="pref-sfx"
                type="range"
                data-option="sfx"
                min="0"
                max="100"
                step="1"
            /></label>
            <button type="button" class="pref-action" data-command="sample">
              Preview mix
            </button>
          </section>
          <section
            class="pref-panel"
            role="tabpanel"
            id="game-panel"
            aria-labelledby="game-tab"
            hidden
          >
            <label class="pref-toggle"
              ><span
                >Reduced motion<small
                  >Limit flashes and ambient animation</small
                ></span
              ><input type="checkbox" data-option="reduced"
            /></label>
            <label class="pref-toggle"
              ><span
                >Fast dialogue<small
                  >Show dialogue text immediately</small
                ></span
              ><input type="checkbox" data-option="fast"
            /></label>
            <button type="button" class="pref-action" data-command="bindings">
              Keyboard bindings <span aria-hidden="true">›</span>
            </button>
            <button type="button" class="pref-action" data-command="import">
              Import save <span aria-hidden="true">›</span>
            </button>
          </section>
        </div>
      </div>
      <footer class="pref-footer">
        <span id="pref-save" role="status"></span
        ><button type="button" data-command="back">Done</button>
      </footer>
    </dialog>
    <input hidden id="loadfile" type="file" accept=".json,application/json" />
    <script>
      "use strict";
      const cv = document.querySelector("canvas"),
        W = 384,
        H = 216,
        TAU = Math.PI * 2;
      const graphicsPresets = {
        classic: { name: "Classic", scale: 1, samples: 2, texture: 1 },
        balanced: { name: "Balanced", scale: 3, samples: 3, texture: 1 },
        high: { name: "High", scale: 5, samples: 5, texture: 2 },
      };
      let graphics = graphicsPresets.high;
      let g = cv.getContext("2d");
      g.imageSmoothingEnabled = false;
      const clamp = (n, a, b) => Math.max(a, Math.min(b, n)),
        dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
        unit = (x, y) => {
          let d = Math.hypot(x, y) || 1;
          return [x / d, y / d];
        },
        rng = (s) => () =>
          (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
      function rect(x, y, w, h, c) {
        g.fillStyle = c;
        if (graphics.scale === 1)
          g.fillRect(Math.round(x), Math.round(y), Math.ceil(w), Math.ceil(h));
        else g.fillRect(x, y, w, h);
      }
      function poly(p, c) {
        g.fillStyle = c;
        g.beginPath();
        p.forEach(([x, y], i) => {
          if (graphics.scale === 1) {
            x = Math.round(x);
            y = Math.round(y);
          }
          if (i) g.lineTo(x, y);
          else g.moveTo(x, y);
        });
        g.closePath();
        g.fill();
      }
      function line(x, y, X, Y, c) {
        if (graphics.scale > 1) {
          g.strokeStyle = c;
          g.lineWidth = 0.8;
          g.beginPath();
          g.moveTo(x + 0.5, y + 0.5);
          g.lineTo(X + 0.5, Y + 0.5);
          g.stroke();
          return;
        }
        let n = Math.max(Math.abs(X - x), Math.abs(Y - y), 1);
        for (let i = 0; i <= n; i++)
          rect(x + ((X - x) * i) / n, y + ((Y - y) * i) / n, 1, 1, c);
      }
      function oval(x, y, rx, ry, c) {
        if (graphics.scale > 1 && rx > 0 && ry > 0) {
          g.fillStyle = c;
          g.beginPath();
          g.ellipse(x, y, rx, ry, 0, 0, TAU);
          g.fill();
          return;
        }
        for (let j = -Math.floor(ry); j <= ry; j++) {
          let w = Math.round(
            rx * Math.sqrt(Math.max(0, 1 - (j * j) / (ry * ry || 1))),
          );
          rect(x - w, y + j, w * 2 + 1, 1, c);
        }
      }
      function txt(
        s,
        x,
        y,
        c = "#f5eaca",
        n = 7,
        align = "left",
        font = "monospace",
      ) {
        g.font = n + "px " + font;
        g.fillStyle = c;
        g.textAlign = align;
        g.fillText(s, Math.round(x), Math.round(y));
        g.textAlign = "left";
      }
      function spaced(s, x, y, space, c, n = 6) {
        g.font = n + "px monospace";
        for (let a of s) {
          txt(a, x, y, c, n);
          x += g.measureText(a).width + space;
        }
      }
      function frame(x, y, w, h) {
        function corners(d) {
          return [
            [x + d, y],
            [x + w - d, y],
            [x + w, y + d],
            [x + w, y + h - d],
            [x + w - d, y + h],
            [x + d, y + h],
            [x, y + h - d],
            [x, y + d],
          ];
        }
        poly(corners(4), "#151627");
        g.save();
        g.beginPath();
        for (const [i, [X, Y]] of corners(4).entries())
          i ? g.lineTo(X, Y) : g.moveTo(X, Y);
        g.closePath();
        g.clip();
        const panel = g.createLinearGradient(x, y, x + w * 0.65, y + h);
        panel.addColorStop(0, "#343d58");
        panel.addColorStop(0.5, "#202b41");
        panel.addColorStop(1, "#171e33");
        g.fillStyle = panel;
        g.fillRect(x + 1, y + 1, w - 2, h - 2);
        g.strokeStyle = "#c2a373";
        g.lineWidth = 0.73;
        for (const inset of [1, 3.15]) {
          g.beginPath();
          for (const [i, [X, Y]] of corners(4).entries()) {
            const u = X + (X < x + w / 2 ? inset : -inset),
              v = Y + (Y < y + h / 2 ? inset : -inset);
            i ? g.lineTo(u, v) : g.moveTo(u, v);
          }
          g.closePath();
          g.stroke();
          g.strokeStyle = "#82725480";
        }
        if (w > 80 && h > 13)
          for (const [X, Y] of [
            [x + 5, y + 5],
            [x + w - 5, y + 5],
            [x + 5, y + h - 5],
            [x + w - 5, y + h - 5],
          ]) {
            petalGlyph(X, Y, 1.81, "#d0af7b");
            rect(X - 0.27, Y - 0.37, 0.54, 0.68, "#f5d9a0");
          }
        g.restore();
      }
      function spark(x, y, c, n = 2) {
        rect(x - n, y, n * 2 + 1, 1, c);
        rect(x, y - n, 1, n * 2 + 1, c);
      }
      function wrap(s, w) {
        let out = [""];
        for (let a of s.split(" ")) {
          let i = out.length - 1;
          if ((out[i] + " " + a).trim().length > w) out.push(a);
          else out[i] = (out[i] + " " + a).trim();
        }
        return out;
      }
      const toolsList = [
        "Gale Disc",
        "River Boots",
        "Lodestone Gauntlet",
        "Prism Lens",
        "Wraith Mantle",
        "Echo Chime",
        "Stillglass",
        "Cinder Rod",
        "Rootbind Staff",
        "Dawnsteel",
        "Burst Satchel",
      ];
      const descriptions = [
        "A returning blade cuts vines, rings nodes and collects drops.",

      function bevelBox(m, x, y, z, w, h, d, mat, bevel = 0.65) {
        let section = (Y, W, D) =>
          [
            [-W + bevel, D],
            [W - bevel, D],
            [W, D - bevel],
            [W, -D + bevel],
            [W - bevel, -D],
            [-W + bevel, -D],
            [-W, -D + bevel],
            [-W, D - bevel],
          ].map(([X, Z]) => [x + X, Y, z + Z]);
        let low = section(y, w * 0.5 - bevel, d * 0.5 - bevel),
          rim = section(y + bevel, w * 0.5, d * 0.5),
          upper = section(y + h - bevel, w * 0.5, d * 0.5),
          cap = section(y + h, w * 0.5 - bevel, d * 0.5 - bevel);
        m.skin([low, rim, upper, cap], mat);
        for (let i = 1; i < cap.length - 1; i++)
          m.face(cap[0], cap[i], cap[i + 1], mat);
      }

            for (let i = 0; i < 18; i++) {
              const x =
                  54 + ((i * 37) % 148) + Math.sin(phase * 0.08 + i) * 2.3,
                y = 139 + ((((i * 17 - phase * 0.18) % 52) + 52) % 52);
              oval(x, y, 0.55, 0.65, i % 3 ? "#f3d895ae" : "#e7d6a76b");
            }
        } finally {
          g = target;
        }
      }
      const preferences = document.getElementById("preferences"),
        hudSettings = document.getElementById("hud-settings");
      hudSettings.onclick = () => {
        if (mode === "play") openMenu("settings");
      };
      let preferenceTab = "graphics",
        settingsReturn = "title",
        redrawBehindSettings = true;
      function showPreferenceTab(name) {
        preferenceTab = name;
        for (const tab of preferences.querySelectorAll("[data-tab]")) {
          const selected = tab.dataset.tab === name;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
          document.getElementById(tab.getAttribute("aria-controls")).hidden =
            !selected;
        }
      }
      function applyBrightness() {
        const filter =
          opts.brightness === 100
            ? "none"
            : "brightness(" + opts.brightness + "%)";
        cv.style.filter = filter;
        document.getElementById("pref-art").style.filter = filter;
      }
      function reflectPreferences() {
        for (const radio of preferences.querySelectorAll("[name=quality]"))
          radio.checked = radio.value === opts.quality;
        const description = {
          classic: "Original pixel art",
          balanced: "Smooth edges and shaded models",
          high: "Fine terrain and full-detail models",
        };
        document.getElementById("quality-description").textContent =
          W * graphics.scale +
          " × " +
          H * graphics.scale +
          " · " +
          description[opts.quality];
        for (const el of preferences.querySelectorAll("[data-option]")) {
          const value = opts[el.dataset.option];
          if (el.type === "checkbox") el.checked = value;
          else {
            el.value = value;
            el.closest("label").querySelector("output").value = value + "%";
            el.style.setProperty(
              "--fill",
              ((value - el.min) / (el.max - el.min)) * 100 + "%",
            );
          }
        }
        preferences.querySelector("[data-command=sample]").textContent =
          opts.sound ? "Preview mix" : "Enable sound & preview";
      }
      function showPreferences(fromBindings) {
        if (!fromBindings) preferenceTab = "graphics";
        showPreferenceTab(preferenceTab);
        reflectPreferences();
        document.getElementById("pref-save").textContent =
          "Changes apply immediately";
        redrawBehindSettings = true;
        previewFrame = -1;
        if (!preferences.open) preferences.showModal();
        document
          .getElementById(preferenceTab + "-tab")
          .focus({ preventScroll: true });
        drawSettingsPreview();
      }
      function savePreference() {
        document.getElementById("pref-save").textContent = soundSave()
          ? "Settings saved"
          : "Settings apply for this session";
      }
      preferences.addEventListener("input", (e) => {
        const el = e.target;
        if (el.name === "quality") {
          if (opts.quality === el.value) return;
          opts.quality = el.value;
          applyGraphics();
          vistaLayer = null;
          redrawBehindSettings = true;
        } else if (el.dataset.option) {
          const key = el.dataset.option;
          opts[key] = el.type === "checkbox" ? el.checked : Number(el.value);
          if (key === "sound" && opts.sound) wake();
          if (["master", "music", "sfx", "sound"].includes(key)) syncMixer();
          if (key === "brightness") applyBrightness();
          if (key === "atmosphere" || key === "reduced") {
            previewFrame = -1;
            redrawBehindSettings = true;
          }
        } else return;
        reflectPreferences();
        savePreference();
        drawSettingsPreview();
      });
      preferences.addEventListener("change", (e) => {
        const key = e.target.dataset.option;
        if (["music", "sfx", "master"].includes(key) && opts.sound)
          previewAudio(key);
      });
      preferences.addEventListener("click", (e) => {
        const el = e.target.closest("button");
        if (!el) return;
        if (el.dataset.tab) {
          showPreferenceTab(el.dataset.tab);
          return;
        }
        switch (el.dataset.command) {
          case "back":
            closeMenu();
            break;
          case "bindings":
            openMenu("bindings");
            break;
          case "import":
            document.getElementById("loadfile").click();
            break;
          case "sample":
            if (!opts.sound) {
              opts.sound = true;
              wake();
              syncMixer();
              reflectPreferences();
              savePreference();
            }
            previewAudio("master");
            break;
        }
      });
      preferences.addEventListener("cancel", (e) => {
        e.preventDefault();
        closeMenu();
      });
      function movePreferenceTab(direction) {
        const tabs = [...preferences.querySelectorAll("[data-tab]")],
          i = tabs.findIndex((el) => el.dataset.tab === preferenceTab);
        const next = tabs[(i + direction + tabs.length) % tabs.length];
        showPreferenceTab(next.dataset.tab);
        next.focus();
      }
      preferences.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          closeMenu();
          e.stopPropagation();
        } else if (
          e.target.dataset.tab &&
          ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
        ) {
          e.preventDefault();
          if (e.key === "Home" || e.key === "End") {
            const tab = e.key === "Home" ? "graphics" : "game";
            showPreferenceTab(tab);
            document.getElementById(tab + "-tab").focus();
          } else movePreferenceTab(e.key === "ArrowLeft" ? -1 : 1);
        }
      });
      function settingsGamepad() {
        if (pressed.has("pause") || pressed.has("dodge")) {
          closeMenu();
          return;
        }
        const active = document.activeElement,
          controls = [...preferences.querySelectorAll("button,input")].filter(
            (el) =>
              el.getClientRects().length &&
              (!el.dataset.tab || el.dataset.tab === preferenceTab) &&
              (el.type !== "radio" || el.checked),
          );
        let dir = pressed.has("down") ? 1 : pressed.has("up") ? -1 : 0;
        if (dir) {
          controls[
            (controls.indexOf(active) + dir + controls.length) % controls.length
          ]?.focus();
          return;
        }
        dir = pressed.has("right") ? 1 : pressed.has("left") ? -1 : 0;
        if (dir && active.dataset.tab) movePreferenceTab(dir);
        else if (dir && active.type === "radio") {
          const radios = [...preferences.querySelectorAll("[name=quality]")],
            next =
              radios[clamp(radios.indexOf(active) + dir, 0, radios.length - 1)];
          next.click();
          next.focus();
        } else if (dir && active.type === "range") {
          if (dir > 0) active.stepUp(5);
          else active.stepDown(5);
          active.dispatchEvent(new Event("input", { bubbles: true }));
          active.dispatchEvent(new Event("change", { bubbles: true }));
        } else if (pressed.has("attack") || pressed.has("act")) active.click();
      }
      applyGraphics();
      applyBrightness();
      if (new URLSearchParams(location.search).get("launch") === "1") {
        // A damaged save still gets the title screen and its explicit New Journey option.
        if (saved) start(true);
        else {
          let existing = null;
          try {
            existing = localStorage.getItem(KEY);
          } catch {}
          if (existing === null) start(false);
        }
      }
      paint();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
